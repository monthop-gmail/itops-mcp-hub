proxy_http_version 1.1;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
gzip off;
chunked_transfer_encoding on;
proxy_set_header X-Accel-Buffering no;

proxy_connect_timeout 60s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-MCP-Role $mcp_role;

# Cloudflare Access + MCP client headers (do not drop Authorization; hubs ignore it)
proxy_set_header Authorization $http_authorization;
proxy_set_header CF-Access-Client-Id $http_cf_access_client_id;
proxy_set_header CF-Access-Client-Secret $http_cf_access_client_secret;
proxy_set_header CF-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header mcp-session-id $http_mcp_session_id;
proxy_set_header Accept $http_accept;
proxy_set_header Last-Event-ID $http_last_event_id;

proxy_hide_header X-Powered-By;
add_header Cache-Control "no-cache, no-store, must-revalidate";
add_header X-Accel-Buffering no;
add_header Access-Control-Allow-Origin * always;
add_header Access-Control-Expose-Headers "WWW-Authenticate, mcp-session-id" always;
